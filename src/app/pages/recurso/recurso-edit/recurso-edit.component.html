<div class="modal fade" id="editRecurso" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="projectModalLabel">{{title}}: {{recursoSeleccionado?.titulo}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    (click)="onClose()"></button>
            </div>
            <div class="modal-body">
                <app-loading *ngIf="isLoading"></app-loading>
                <div class="container" *ngIf="!isLoading">
                    <form *ngIf="projectForm" class="form-horizontal form-material" [formGroup]="projectForm">
                        <div class="row">
                            <div class="col-xs-12 col-md-4">
                                <label>Nombre del Proyecto <span class="required">*</span></label>
                                <input type="text" formControlName="titulo" class="form-control"
                                    (blur)="verificarProject($event)" required>
                                <div *ngIf="projectForm.get('titulo')?.touched" class="text-danger">
                                    <div *ngIf="projectForm.get('titulo')?.errors?.['required']">
                                        Campo Requerido
                                    </div>
                                    <div *ngIf="projectForm.get('titulo')?.errors?.['minlength']">
                                        Mínimo 3 Caracteres
                                    </div>
                                </div>

                            </div>
                            <div class="col-xs-12 col-md-4">
                                <label>urlMedia<span class="required">*</span></label>
                                <input type="text" formControlName="urlMedia" class="form-control"
                                    (blur)="verificarProject($event)" required>
                                <div *ngIf="projectForm.get('urlMedia')?.touched" class="text-danger">
                                    <div *ngIf="projectForm.get('urlMedia')?.errors?.['required']">
                                        Campo Requerido
                                    </div>
                                    <div *ngIf="projectForm.get('urlMedia')?.errors?.['minlength']">
                                        Mínimo 3 Caracteres
                                    </div>
                                </div>

                            </div>
                            <div class="col-xs-12 col-md-6">
                                <label>descripcion </label>
                                <textarea formControlName="descripcion" id="descripcion"
                                    class="form-control"></textarea>
                            </div>


                            <div class="row mb-3">

                                <div class="col-xs-12 col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" formControlName="activo" type="checkbox"
                                            id="flexCheckstatus">
                                        <label class="form-check-label" for="flexCheckstatus">
                                            ¿activo?
                                        </label>
                                    </div>
                                </div>
                            </div>


                            <div class="clear"></div>
                            <br>
                            <div class="row">

                                <div class="col-xs-12 col-md-4">
                                    <label>Tipo</label>
                                    <select class="form-control selecttyp" formControlName="tipo">
                                        <option value="">Seleccione</option>
                                        <option value="video">Video</option>
                                        <option value="banner">Banner</option>
                                    </select>
                                    <div *ngIf="projectForm.get('tipo')?.touched && projectForm.get('tipo')?.errors?.['required']"
                                        class="text-danger">Campo Requerido</div>

                                </div>
                                <div class="col-xs-12 col-md-4">
                                    <label>categoria</label>
                                    <select class="form-control selecttyp" formControlName="categoria">
                                        <option value="">Seleccione</option>
                                        <option value="general">general</option>
                                        <option value="odontologia">odontologia</option>
                                        <option value="asistentes">asistentes</option>
                                        <option value="whatsapp">whatsapp</option>
                                    </select>
                                    <div *ngIf="projectForm.get('categoria')?.touched && projectForm.get('categoria')?.errors?.['required']"
                                        class="text-danger">Campo Requerido</div>

                                </div>

                            </div>
                        </div>

                        <div class="row">

                            <div class="col-4">
                                <button (click)="handleSubmit()" class="btn btn-outline-success">
                                    {{ recursoSeleccionado ? 'Actualizar y Continuar' : 'Crear y Continuar' }}
                                </button>
                            </div>
                        </div>

                    </form>

                </div>
            </div>
            <div class="modal-footer ">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                    (click)="onClose()">Cerrar</button>
            </div>
        </div>
    </div>
</div>
